[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reusable-foundations"
version = "0.1.0"
description = "Composable application foundations with explicit provider adapters"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
firebase = ["firebase-admin>=6,<8"]
ses = ["boto3>=1.35,<2"]
razorpay = ["razorpay>=1.4,<3"]

[tool.setuptools.packages.find]
where = ["src"]
